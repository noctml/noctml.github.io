  <link rel="stylesheet" href="assets/site-theme.css?v=quiet-archive-20260601c" />
  <link rel="stylesheet" href="styles.css?v=home-single-divider-20260609" />

  <style>
    /* Sidebar */
    .sidebar-card{
      display:flex;
      flex-direction:column;
      min-height: calc(100dvh - 40px);
    }
    .sidebar-bottom{
      margin-top:auto;
      display:grid;
      gap:10px;
      padding-top:12px;
    }
    .contact-buttons{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:9px;
    }
    .contact-label{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:10px;
      color:color-mix(in srgb, var(--muted) 72%, transparent);
      font-size:10px;
      line-height:1.2;
      font-weight:500;
      letter-spacing:.08em;
      text-align:center;
      text-transform:lowercase;
    }
    .contact-label::before,
    .contact-label::after{
      content:"";
      height:1px;
      background:var(--line);
    }
    .contact-icon{
      width:24px;
      height:24px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:0;
      border-radius:6px;
      background:transparent;
      color:var(--muted);
      transition:color .15s ease, transform .15s ease;
    }
    .contact-icon:hover{
      opacity:1;
      color:var(--text);
      transform:translateY(-1px);
    }
    .contact-icon svg{
      width:18px;
      height:18px;
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .contact-icon.cv svg{
      width:20px;
      height:20px;
    }
    .contact-icon.github svg,
    .contact-icon.linkedin svg,
    .contact-icon.youtube svg{
      fill:currentColor;
      stroke:none;
    }

    /* Section header + pager */
    .section-head.row{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:14px;
      margin-bottom:14px;
      padding:0 0 12px;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
    }
    #paper-reviews,
    #paper-summary{
      padding-top:30px;
    }
    #paper-reviews .section-head.row h2,
    #paper-summary .section-head.row h2{
      font-size:22px;
      letter-spacing:-0.018em;
    }
    .section-credit{
      margin:4px 0 0;
      color:var(--muted);
      font-size:11px;
      font-weight:500;
      line-height:1.2;
      opacity:.62;
    }
    #work .section-head.row h2{
      font-size:22px;
      letter-spacing:-0.018em;
    }
    .pager{
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
      white-space:nowrap;
    }
    .pager .page-indicator{
      font-size:12px;
      color:var(--muted);
      min-width:52px;
      text-align:center;
    }
    .pager-btn{
      width:32px;
      height:32px;
      border-radius:9px;
      border:1px solid var(--line);
      background:transparent;
      box-shadow:none;
      color:var(--text);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .pager-btn:active{ transform: translateY(1px); }
    .pager-btn[disabled]{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }
    .paper-groups{
      display:flex;
      flex-wrap:nowrap;
      gap:2px;
      width:100%;
      margin:0 0 18px;
      padding:0 18px 8px 0;
      overflow-x:auto;
      border:0;
      border-bottom:1px solid var(--line);
      border-radius:0;
      background:transparent;
      scrollbar-width:none;
      -webkit-mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent 100%);
      mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 30px), transparent 100%);
    }
    .paper-groups::-webkit-scrollbar{
      display:none;
    }
    .paper-group-btn{
      display:inline-flex;
      align-items:center;
      gap:7px;
      flex:0 0 auto;
      min-height:28px;
      padding:5px 9px;
      border:0;
      border-radius:7px;
      background:transparent;
      color:var(--muted);
      font-size:12px;
      font-weight:680;
      line-height:1.1;
      cursor:pointer;
      transition:background .15s ease, color .15s ease;
    }
    .paper-group-btn span:first-child{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .paper-group-btn:hover{
      color:var(--text);
      background:color-mix(in srgb, var(--panel) 70%, transparent);
    }
    .paper-group-btn.is-active{
      color:var(--text);
      background:color-mix(in srgb, var(--panel) 74%, transparent);
      box-shadow:inset 0 -1px 0 color-mix(in srgb, var(--text) 34%, transparent);
    }
    .paper-group-count{
      color:color-mix(in srgb, var(--muted) 80%, var(--text));
      font-size:10.5px;
      font-weight:760;
      letter-spacing:.02em;
    }

    /* Fixed frame to prevent layout jump */
    .paper-frame{
      min-height: calc(5 * 112px + 4 * 12px);
      display:grid;
      gap:12px;
    }

    .paper-card{
      min-height:112px;
      display:grid;
      grid-template-columns: 136px minmax(0, 1fr) auto;
      align-items:center;
      gap:14px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:color-mix(in srgb, var(--panel2) 88%, var(--bg));
      box-shadow:none;
      color:inherit;
      text-decoration:none;
      transition:background .15s ease, border-color .15s ease, transform .15s ease, opacity .15s ease;
    }
    .paper-card:hover{
      transform: translateY(-1px);
      border-color:color-mix(in srgb, var(--line) 62%, var(--text) 24%);
      background:color-mix(in srgb, var(--panel2) 72%, var(--bg));
    }
    .paper-thumb{
      width:136px;
      aspect-ratio:16 / 10;
      border-radius:9px;
      border:1px solid color-mix(in srgb, var(--line) 84%, transparent);
      background: color-mix(in srgb, var(--panel) 58%, transparent);
      overflow:hidden;
    }
    .paper-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      opacity:.9;
      filter:saturate(.82) contrast(.98);
      transition:opacity .15s ease, filter .15s ease;
    }
    .paper-body{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:5px;
    }
    .paper-card .row-title{
      line-height:1.25;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .paper-card .row-sub{
      line-height:1.45;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
      color:color-mix(in srgb, var(--muted) 88%, var(--text));
      font-size:12.5px;
    }
    .paper-date{
      color:var(--muted);
      font-size:10px;
      line-height:1.15;
      letter-spacing:.01em;
      opacity:.56;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }
    .paper-card:hover .paper-thumb img{
      opacity:.98;
      filter:saturate(.96) contrast(1);
    }
    .paper-card.placeholder{
      opacity:.45;
      pointer-events:none;
    }
    .paper-card.placeholder .paper-thumb,
    .paper-card.placeholder .row-title,
    .paper-card.placeholder .row-sub{
      border-radius:10px;
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      border:1px solid var(--line);
      color:transparent;
    }
    .paper-card.placeholder .row-title{ height:16px; width:72%; }
    .paper-card.placeholder .row-sub{ height:12px; width:88%; }

    /* Work: 3 rows x 2 cols fixed */
    .work-frame{
      min-height: 0;
    }

    .grid.fixed-rows{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:14px;
      grid-auto-rows: 196px;
    }

    /* Disabled state */
    .is-disabled{
      opacity:0.45;
      pointer-events:none;
    }
    .coming-text{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
    }

    /* Work cards: keep identical sizing */
    #workGrid { grid-auto-rows: 196px; }
    #workGrid .card{
      height:196px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      text-decoration:none;
      color:inherit;
      overflow:hidden;
    }

    /* Work card layout */
    .work-card{
      height:196px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .work-thumb{
      height:110px;
      border-radius:10px;
      border:1px solid color-mix(in srgb, var(--line) 84%, transparent);
      background: color-mix(in srgb, var(--panel) 58%, transparent);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .work-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      opacity:.9;
      filter:saturate(.82) contrast(.98);
      transition:opacity .15s ease, filter .15s ease;
    }
    .work-body{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-height: 0;
    }
    .work-title{
      font-weight: 750;
      letter-spacing: -0.01em;
      line-height: 1.2;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
      color:var(--text);
    }
    .work-desc{
      font-size: 13px;
      color: color-mix(in srgb, var(--muted) 88%, var(--text));
      line-height: 1.25;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    #workGrid .card:hover .work-thumb img{
      opacity:.98;
      filter:saturate(.96) contrast(1);
    }
    .work-meta{
      margin-top:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      color: var(--muted);
      padding-top: 2px;
    }

    /* Work placeholders keep same frame */
    .card.placeholder{
      opacity:0.45;
      pointer-events:none;
    }
    .card.placeholder .work-thumb,
    .card.placeholder .work-title,
    .card.placeholder .work-desc,
    .card.placeholder .work-date{
      border-radius:10px;
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      border:1px solid var(--line);
      color:transparent;
    }
    .card.placeholder .work-title{ height:16px; width:72%; }
    .card.placeholder .work-desc{ height:12px; width:88%; }
    .card.placeholder .work-date{ height:12px; width:40%; }

    /* Unpublished card: same structure, show "준비중..." */
    .work-unpub{
      height:196px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .work-unpub .work-thumb{
      position:relative;
    }
    .work-unpub .work-thumb::after{
      content:"준비중...";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      color:var(--muted);
      background: color-mix(in srgb, var(--bg) 35%, transparent);
      backdrop-filter: blur(2px);
    }

    @media (max-width: 620px){
      .paper-frame{
        min-height: calc(5 * 150px + 4 * 12px);
      }
      .paper-card{
        min-height:150px;
        grid-template-columns: 104px minmax(0, 1fr);
      }
      .paper-thumb{ width:104px; }
    }

    /* Quiet archive: flatten cards into rows and reduce wrapper weight. */
    .paper-frame{
      gap:0;
      min-height: calc(5 * 148px);
      border-bottom:0;
      align-content:start;
      grid-auto-rows:148px;
    }
    .paper-card{
      height:148px;
      min-height:148px;
      grid-template-columns:174px minmax(0, 1fr);
      align-items:start;
      padding:18px 2px;
      border:0;
      border-top:1px solid var(--line);
      border-radius:0;
      background:transparent;
      box-shadow:none;
    }
    .paper-card:hover{
      transform:none;
      background:color-mix(in srgb, var(--panel) 35%, transparent);
      border-color:var(--line);
    }
    .paper-thumb{
      width:174px;
      border-radius:4px;
      border:1px solid color-mix(in srgb, var(--line) 70%, transparent);
      background:transparent;
    }
    .paper-card .row-title{
      font-size:16.5px;
      font-weight:760;
      line-height:1.28;
    }
    .paper-card .row-sub{
      font-size:13.5px;
      line-height:1.5;
    }
    .paper-date{
      font-size:11px;
      margin-top:auto;
    }
    .paper-body{
      height:100%;
      gap:7px;
      padding:1px 0 2px;
    }
    .paper-bottom-pager,
    .project-bottom-pager,
    .study-bottom-pager{
      justify-content:center;
      width:100%;
      margin-top:18px;
      padding-top:4px;
    }
    .pager-pages{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:4px;
    }
    .pager-page-btn{
      width:30px;
      height:30px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:0;
      border-radius:7px;
      background:transparent;
      color:var(--muted);
      font-size:12px;
      font-weight:720;
      line-height:1;
      cursor:pointer;
      transition:background .15s ease, color .15s ease;
    }
    .pager-page-btn:hover{
      color:var(--text);
      background:color-mix(in srgb, var(--panel) 60%, transparent);
    }
    .pager-page-btn.is-active{
      color:var(--text);
      background:color-mix(in srgb, var(--panel) 78%, transparent);
      box-shadow:inset 0 -1px 0 color-mix(in srgb, var(--text) 32%, transparent);
    }
    .paper-bottom-pager .pager-btn,
    .project-bottom-pager .pager-btn,
    .study-bottom-pager .pager-btn{
      border-color:transparent;
      color:color-mix(in srgb, var(--muted) 78%, transparent);
      background:transparent;
    }
    .paper-bottom-pager .pager-btn:not([disabled]):hover,
    .project-bottom-pager .pager-btn:not([disabled]):hover,
    .study-bottom-pager .pager-btn:not([disabled]):hover{
      color:var(--text);
      background:color-mix(in srgb, var(--panel) 54%, transparent);
    }
    .paper-card.placeholder .paper-thumb,
    .paper-card.placeholder .row-title,
    .paper-card.placeholder .row-sub{
      border-radius:4px;
    }
    .grid.fixed-rows{
      grid-template-columns:1fr;
      column-gap:18px;
      row-gap:0;
      grid-auto-rows:auto;
      border-bottom:0;
    }
    #workGrid[data-work-list]{
      display:grid;
      grid-template-columns:1fr;
      gap:0;
      min-height:calc(5 * 148px);
      align-content:start;
      grid-auto-rows:148px;
      border-bottom:0;
    }
    #workGrid .card{
      height:172px;
      padding:14px 2px 13px;
      border:0;
      border-top:1px solid var(--line);
      border-radius:0;
      background:transparent;
    }
    #workGrid .card:hover{
      transform:none;
      background:color-mix(in srgb, var(--panel) 35%, transparent);
      border-color:var(--line);
    }
    .work-card,
    .work-unpub{
      height:145px;
      gap:9px;
    }
    .work-body{ gap:5px; }
    .work-thumb{
      height:82px;
      border-radius:4px;
      background:transparent;
    }
    .card.placeholder .work-thumb,
    .card.placeholder .work-title,
    .card.placeholder .work-desc,
    .card.placeholder .work-date{
      border-radius:4px;
    }
    .project-card{
      height:148px;
      min-height:148px;
      display:grid;
      grid-template-columns:174px minmax(0, 1fr);
      align-items:start;
      gap:14px;
      padding:18px 2px;
      border-top:1px solid var(--line);
      color:inherit;
      text-decoration:none;
      transition:background .15s ease;
    }
    .project-card:hover{
      background:color-mix(in srgb, var(--panel) 35%, transparent);
      opacity:1;
    }
    .project-thumb{
      width:174px;
      aspect-ratio:16 / 10;
      border-radius:4px;
      border:1px solid color-mix(in srgb, var(--line) 70%, transparent);
      background:transparent;
      overflow:hidden;
    }
    .project-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      opacity:.9;
      filter:saturate(.82) contrast(.98);
      transition:opacity .15s ease, filter .15s ease;
    }
    .project-body{
      height:100%;
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:7px;
      padding:1px 0 2px;
    }
    .project-card .row-title{
      color:var(--text);
      font-size:16.5px;
      font-weight:760;
      line-height:1.28;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .project-card .row-sub{
      color:color-mix(in srgb, var(--muted) 88%, var(--text));
      font-size:13.5px;
      line-height:1.5;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .project-date{
      margin-top:auto;
      color:var(--muted);
      font-size:11px;
      line-height:1.15;
      letter-spacing:.01em;
      opacity:.56;
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }
    .project-card:hover .project-thumb img{
      opacity:.98;
      filter:saturate(.96) contrast(1);
    }

    @media (max-width: 620px){
      .paper-frame{
        min-height: calc(5 * 172px);
        grid-auto-rows:172px;
      }
      #workGrid[data-work-list]{
        min-height:calc(5 * 172px);
        grid-auto-rows:172px;
      }
      .paper-card{
        height:172px;
        min-height:172px;
        grid-template-columns:128px minmax(0, 1fr);
        padding:18px 0;
      }
      .paper-thumb{ width:128px; }
      .project-card{
        height:172px;
        min-height:172px;
        grid-template-columns:128px minmax(0, 1fr);
        padding:18px 0;
      }
      .project-thumb{ width:128px; }
    }
  </style>
</head>

<body>
  <a class="skip" href="#main">본문으로 바로가기</a>

  <div class="layout" id="top">
    <aside class="sidebar" aria-label="Sidebar">
      <div class="sidebar-card">
        <div>
          <div class="avatar-wrap">
            <img class="avatar" src="assets/avatar.jpg" alt="Wooseok Song profile photo" />
          </div>

          <div class="who">
            <div class="name">Wooseok Song</div>
            <p class="profile-line">Visual SLAM · 3D Perception</p>
          </div>

          <div class="info">
            <div class="info-row">
              <span class="label">Focus</span>
              <span class="value">SLAM, Deep Learning</span>
            </div>
            <div class="info-row">
              <span class="label">Location</span>
              <span class="value">Korea</span>
            </div>
          </div>

          <section class="visit-card" aria-label="Visitor count">
            <div class="visit-card-head">
              <span class="label">Visits</span>
            </div>
            <div class="visit-grid">
              <div class="visit-stat">
                <span class="visit-label">Today</span>
                <strong id="visitToday">--</strong>
              </div>
              <div class="visit-stat">
                <span class="visit-label">Yesterday</span>
                <strong id="visitYesterday">--</strong>
              </div>
            </div>
          </section>
        </div>

        <div class="sidebar-bottom">
          <div class="contact-label"><span>info</span></div>
          <div class="contact-buttons" aria-label="Information links">

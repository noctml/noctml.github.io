<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Wooseok Song · Paper Reviews & Work" />
  <title>Wooseok Song</title>

  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon.png" />
  <meta property="og:title" content="Wooseok Song" />
  <meta property="og:description" content="Paper Reviews & Work" />
  <meta property="og:type" content="website" />
  <meta name="visit-counter-endpoint" content="https://wooseok-visit-counter.pdwytime.workers.dev" />

  <link rel="stylesheet" href="styles.css?v=main-cleanup-20260525" />

  <style>
    /* Sidebar */
    .sidebar-card{
      display:flex;
      flex-direction:column;
      min-height: calc(100dvh - 40px);
    }
    .sidebar-bottom{
      margin-top:auto;
      display:grid;
      gap:10px;
      padding-top:12px;
    }
    .contact-buttons{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:13px;
    }
    .contact-label{
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:10px;
      color:color-mix(in srgb, var(--muted) 72%, transparent);
      font-size:10px;
      line-height:1.2;
      font-weight:500;
      letter-spacing:.08em;
      text-align:center;
      text-transform:lowercase;
    }
    .contact-label::before,
    .contact-label::after{
      content:"";
      height:1px;
      background:var(--line);
    }
    .contact-icon{
      width:24px;
      height:24px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:0;
      border-radius:6px;
      background:transparent;
      color:var(--muted);
      transition:color .15s ease, transform .15s ease;
    }
    .contact-icon:hover{
      opacity:1;
      color:var(--text);
      transform:translateY(-1px);
    }
    .contact-icon svg{
      width:18px;
      height:18px;
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }
    .contact-icon.github svg,
    .contact-icon.linkedin svg{
      fill:currentColor;
      stroke:none;
    }

    /* Section header + pager */
    .section-head.row{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:14px;
      margin-bottom:12px;
    }
    .pager{
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
      white-space:nowrap;
    }
    .pager .page-indicator{
      font-size:12px;
      color:var(--muted);
      min-width:52px;
      text-align:center;
    }
    .pager-btn{
      width:34px;
      height:34px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--panel2);
      box-shadow:var(--shadow);
      color:var(--text);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .pager-btn:active{ transform: translateY(1px); }
    .pager-btn[disabled]{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }
    .paper-groups{
      display:flex;
      flex-wrap:nowrap;
      gap:3px;
      width:100%;
      margin:0 0 16px;
      padding:4px;
      overflow-x:auto;
      border:1px solid var(--line);
      border-radius:14px;
      background:color-mix(in srgb, var(--panel2) 78%, var(--bg));
      scrollbar-width:thin;
    }
    .paper-group-btn{
      display:inline-flex;
      align-items:center;
      gap:7px;
      flex:0 0 auto;
      min-height:28px;
      padding:5px 9px;
      border:0;
      border-radius:10px;
      background:transparent;
      color:var(--muted);
      font-size:12px;
      font-weight:680;
      line-height:1.1;
      cursor:pointer;
      transition:background .15s ease, color .15s ease;
    }
    .paper-group-btn span:first-child{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .paper-group-btn:hover{
      color:var(--text);
      background:color-mix(in srgb, var(--panel) 72%, var(--text) 4%);
    }
    .paper-group-btn.is-active{
      color:var(--text);
      background:color-mix(in srgb, var(--panel2) 62%, var(--text) 8%);
      box-shadow:0 1px 0 color-mix(in srgb, #fff 42%, transparent) inset;
    }
    .paper-group-count{
      color:color-mix(in srgb, var(--muted) 80%, var(--text));
      font-size:10.5px;
      font-weight:760;
      letter-spacing:.02em;
    }

    /* Fixed frame to prevent layout jump */
    .paper-frame{
      min-height: calc(5 * 118px + 4 * 12px);
      display:grid;
      gap:12px;
    }

    .paper-card{
      min-height:118px;
      display:grid;
      grid-template-columns: 148px minmax(0, 1fr) auto;
      align-items:center;
      gap:14px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:var(--radius);
      background:var(--panel2);
      box-shadow:0 8px 22px color-mix(in srgb, var(--text) 4%, transparent);
      color:inherit;
      text-decoration:none;
      transition:background .15s ease, border-color .15s ease, transform .15s ease, opacity .15s ease;
    }
    .paper-card:hover{
      transform: translateY(-1px);
      border-color:color-mix(in srgb, var(--line) 62%, var(--text) 24%);
      background:color-mix(in srgb, var(--panel2) 82%, var(--bg));
    }
    .paper-thumb{
      width:148px;
      aspect-ratio:16 / 10;
      border-radius:12px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      overflow:hidden;
    }
    .paper-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .paper-body{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .paper-card .row-title{
      line-height:1.25;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .paper-card .row-sub{
      line-height:1.35;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .paper-card.placeholder{
      opacity:.45;
      pointer-events:none;
    }
    .paper-card.placeholder .paper-thumb,
    .paper-card.placeholder .row-title,
    .paper-card.placeholder .row-sub{
      border-radius:10px;
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      border:1px solid var(--line);
      color:transparent;
    }
    .paper-card.placeholder .row-title{ height:16px; width:72%; }
    .paper-card.placeholder .row-sub{ height:12px; width:88%; }

    /* Work: 3 rows x 2 cols fixed */
    .work-frame{
      min-height: calc(3 * 196px + 2 * 14px);
    }

    .grid.fixed-rows{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:14px;
      grid-auto-rows: 196px;
    }

    /* Disabled state */
    .is-disabled{
      opacity:0.45;
      pointer-events:none;
    }
    .coming-text{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
    }

    /* Work cards: keep identical sizing */
    #workGrid { grid-auto-rows: 196px; }
    #workGrid .card{
      height:196px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      text-decoration:none;
      color:inherit;
      overflow:hidden;
    }

    /* Work card layout */
    .work-card{
      height:196px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .work-thumb{
      height:110px;
      border-radius:14px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .work-thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .work-body{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-height: 0;
    }
    .work-title{
      font-weight: 750;
      letter-spacing: -0.01em;
      line-height: 1.2;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .work-desc{
      font-size: 13px;
      color: var(--muted);
      line-height: 1.25;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .work-meta{
      margin-top:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      color: var(--muted);
      padding-top: 2px;
    }

    /* Work placeholders keep same frame */
    .card.placeholder{
      opacity:0.45;
      pointer-events:none;
    }
    .card.placeholder .work-thumb,
    .card.placeholder .work-title,
    .card.placeholder .work-desc,
    .card.placeholder .work-date{
      border-radius:10px;
      background: color-mix(in srgb, var(--panel) 70%, transparent);
      border:1px solid var(--line);
      color:transparent;
    }
    .card.placeholder .work-title{ height:16px; width:72%; }
    .card.placeholder .work-desc{ height:12px; width:88%; }
    .card.placeholder .work-date{ height:12px; width:40%; }

    /* Unpublished card: same structure, show "준비중..." */
    .work-unpub{
      height:196px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .work-unpub .work-thumb{
      position:relative;
    }
    .work-unpub .work-thumb::after{
      content:"준비중...";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:14px;
      color:var(--muted);
      background: color-mix(in srgb, var(--bg) 35%, transparent);
      backdrop-filter: blur(2px);
    }

    @media (max-width: 620px){
      .paper-frame{
        min-height: calc(5 * 156px + 4 * 12px);
      }
      .paper-card{
        min-height:156px;
        grid-template-columns: 112px minmax(0, 1fr);
      }
      .paper-thumb{ width:112px; }
      .paper-card .arrow{ display:none; }
    }
  </style>
</head>

  <script src="script.js?v=main-cleanup-20260525"></script>

  <script>
    const paperReviews = window.SITE_DATA.paperReviews || [];
    const configuredPaperGroups = window.SITE_DATA.paperGroups || [];
    const workItems    = window.SITE_DATA.projects || [];

    function chunk(arr, size) {
      const out = [];
      for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
      return out;
    }

    function padToSize(arr, size, fillerFactory) {
      const out = arr.slice();
      while (out.length < size) out.push(fillerFactory(out.length));
      return out;
    }

    function pageCount(pages) {
      return Math.max(1, pages.length);
    }

    const PAPER_PAGE_SIZE = 5;
    let activePaperGroup = "All";
    let filteredPaperReviews = paperReviews.slice();
    let paperPages = chunk(filteredPaperReviews, PAPER_PAGE_SIZE);
    let paperPage = 0;

    const paperListEl = document.getElementById("paperList");
    const paperGroupListEl = document.getElementById("paperGroupList");
    const paperPrevEl = document.getElementById("paperPrev");
    const paperNextEl = document.getElementById("paperNext");
    const paperInfoEl = document.getElementById("paperPageInfo");

    function uniquePaperGroups() {
      const discovered = Array.from(new Set(paperReviews.map(item => item.group).filter(Boolean)));
      if (!configuredPaperGroups.length) return discovered;
      const configured = configuredPaperGroups.filter(group => discovered.includes(group));
      const extras = discovered.filter(group => !configured.includes(group));
      return [...configured, ...extras];
    }

    function paperGroupCount(group) {
      if (group === "All") return paperReviews.length;
      return paperReviews.filter(item => item.group === group).length;
    }

    function updatePaperPages() {
      filteredPaperReviews = activePaperGroup === "All"
        ? paperReviews.slice()
        : paperReviews.filter(item => item.group === activePaperGroup);
      paperPages = chunk(filteredPaperReviews, PAPER_PAGE_SIZE);
      if (paperPage >= pageCount(paperPages)) paperPage = 0;
    }

    function renderPaperGroups() {
      const groups = ["All", ...uniquePaperGroups()];
      paperGroupListEl.innerHTML = groups.map(group => {
        const active = group === activePaperGroup ? " is-active" : "";
        const label = safeText(group);
        const count = paperGroupCount(group);
        return `
          <button class="paper-group-btn${active}" type="button" data-paper-group="${safeAttr(group)}" aria-pressed="${group === activePaperGroup}">
            <span>${label}</span>
            <span class="paper-group-count">${count}</span>
          </button>
        `;
      }).join("");
    }

    // for Paper Review
    function renderPaper() {
      updatePaperPages();
      renderPaperGroups();
      const total = pageCount(paperPages);
      const realPage = paperPages[paperPage] || [];

      const page = padToSize(realPage, PAPER_PAGE_SIZE, () => ({
        title: "준비중",
        desc: "준비중",
        href: "#",
        thumb: "",
        published: false,
        __placeholder: true
      }));

      paperListEl.innerHTML = page.map(item => {
        if (item.__placeholder) {
          return `
            <div class="paper-card placeholder" aria-hidden="true">
              <div class="paper-thumb"></div>
              <div class="paper-body">
                <div class="row-title">placeholder</div>
                <div class="row-sub muted">placeholder</div>
              </div>
              <span class="arrow">→</span>
            </div>
          `;
        }

        const disabled = (!item.published);
        const cls = disabled ? "paper-card is-disabled" : "paper-card";
        const title = safeText(item.title);
        const titleAttr = safeAttr(item.title);
        const desc = safeText(item.desc);
        const thumb = safeAttr(item.thumb || "");
        const href = disabled ? "#" : item.href;
        return `
          <a class="${cls}" href="${href}">
            <div class="paper-thumb">
              ${thumb ? `<img src="${thumb}" alt="${titleAttr} thumbnail" loading="lazy" />` : ``}
            </div>
            <div class="paper-body">
              <div class="row-title">${title}</div>
              <div class="row-sub muted">${desc}</div>
              ${disabled ? `<div class="coming-text">준비중...</div>` : ``}
            </div>
            <span class="arrow">→</span>
          </a>
        `;
      }).join("");

      paperInfoEl.textContent = `${paperPage + 1} / ${total}`;
      paperPrevEl.disabled = (paperPage === 0);
      paperNextEl.disabled = (paperPage === total - 1);
    }

    paperGroupListEl.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-paper-group]");
      if (!btn) return;
      activePaperGroup = btn.dataset.paperGroup || "All";
      paperPage = 0;
      renderPaper();
    });

    paperPrevEl.addEventListener("click", () => {
      if (paperPage === 0) return;
      paperPage -= 1;
      renderPaper();
    });

    paperNextEl.addEventListener("click", () => {
      const total = pageCount(paperPages);
      if (paperPage === total - 1) return;
      paperPage += 1;
      renderPaper();
    });

    const WORK_PAGE_SIZE = 6;
    const workPages = chunk(workItems, WORK_PAGE_SIZE);
    let workPage = 0;

    const workGridEl = document.getElementById("workGrid");
    const workPrevEl = document.getElementById("workPrev");
    const workNextEl = document.getElementById("workNext");
    const workInfoEl = document.getElementById("workPageInfo");

    function safeText(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function safeAttr(s) {
      return safeText(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function renderWork() {
      const total = Math.max(1, workPages.length);
      const realPage = workPages[workPage] || [];
      const page = padToSize(realPage, WORK_PAGE_SIZE, () => ({
        __placeholder: true
      }));

      workGridEl.innerHTML = page.map(item => {
        if (item.__placeholder) {
          return `
            <div class="card placeholder" aria-hidden="true">
              <div class="work-card">
                <div class="work-thumb"></div>
                <div class="work-body">
                  <div class="work-title">placeholder</div>
                  <div class="work-desc">placeholder</div>
                  <div class="work-meta">
                    <span class="work-date">placeholder</span>
                    <span></span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        const published = !!item.published && item.href && item.href !== "#";
        const title = safeText(item.title);
        const desc = safeText(item.desc);
        const date = safeText(item.date);
        const thumb = safeText(item.thumb || "");

        if (!published) {
          return `
            <div class="card is-disabled" aria-disabled="true">
              <div class="work-unpub">
                <div class="work-thumb">
                  ${thumb ? `<img src="${thumb}" alt="${title} thumbnail" loading="lazy" />` : ``}
                </div>
                <div class="work-body">
                  <div class="work-title">${title || "준비중"}</div>
                  <div class="work-desc">준비중...</div>
                  <div class="work-meta">
                    <span class="work-date">${date || ""}</span>
                    <span></span>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        return `
          <a class="card" href="${item.href}" style="text-decoration:none;">
            <div class="work-card">
              <div class="work-thumb">
                ${thumb ? `<img src="${thumb}" alt="${title} thumbnail" loading="lazy" />` : ``}
              </div>
              <div class="work-body">
                <div class="work-title">${title}</div>
                <div class="work-desc">${desc}</div>
                <div class="work-meta">
                  <span class="work-date">${date}</span>
                  <span></span>
                </div>
              </div>
            </div>
          </a>
        `;
      }).join("");

      workInfoEl.textContent = `${workPage + 1} / ${total}`;
      workPrevEl.disabled = (workPage === 0);
      workNextEl.disabled = (workPage === total - 1);
    }

    workPrevEl.addEventListener("click", () => {
      if (workPage === 0) return;
      workPage -= 1;
      renderWork();
    });

    workNextEl.addEventListener("click", () => {
      const total = Math.max(1, workPages.length);
      if (workPage >= total - 1) return;
      workPage += 1;
      renderWork();
    });

    renderPaper();
    renderWork();
  </script>
</body>
</html>

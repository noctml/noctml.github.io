<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="VGGT4D 발표 자료. CVPR 2026 논문을 RAISE LAB 스터디 발표 형식으로 정리한 PDF." />
  <meta name="author" content="Wooseok Song" />
  <title>[Study] VGGT4D 발표 자료 | Insighted</title>
  <link rel="icon" type="image/png" sizes="48x48" href="../../../assets/favicon.png" />
  <link rel="stylesheet" href="../../../assets/site-theme.css?v=study-20260705" />
  <link rel="stylesheet" href="../../../styles.css?v=study-20260705" />
  <style>
    body{
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
    }
    .study-shell{
      width:min(1120px, calc(100% - 40px));
      margin:0 auto;
      padding:22px 0 42px;
    }
    .study-topbar{
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 0 16px;
      background:var(--bg);
      backdrop-filter:none;
    }
    .study-brand{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--text);
      text-decoration:none;
      font-size:14px;
      font-weight:760;
      letter-spacing:-0.01em;
    }
    .study-brand img{
      width:30px;
      height:30px;
      border-radius:8px;
      object-fit:cover;
    }
    .study-hero{
      padding:28px 0 20px;
      border-bottom:1px solid var(--line);
    }
    .study-kicker{
      margin:0 0 9px;
      color:var(--muted);
      font-size:11px;
      font-weight:760;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .study-hero h1{
      margin:0;
      max-width:820px;
      font-size:clamp(18px, 2.6vw, 28px);
      line-height:1.18;
      letter-spacing:-0.025em;
    }
    .study-meta{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:12px;
      margin-top:22px;
    }
    .study-meta-item{
      min-height:72px;
      padding:13px 14px;
      border-top:1px solid var(--line);
      background:color-mix(in srgb, var(--panel) 34%, transparent);
    }
    .study-meta-item span{
      display:block;
      margin-bottom:7px;
      color:var(--muted);
      font-size:10px;
      font-weight:760;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .study-meta-item strong{
      display:block;
      color:var(--text);
      font-size:13px;
      line-height:1.35;
    }
    .pdf-section{
      padding-top:24px;
    }
    .pdf-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:16px;
      margin-bottom:12px;
    }
    .pdf-head h2{
      margin:0;
      font-size:22px;
      letter-spacing:-0.02em;
    }
    .pdf-viewer{
      width:100%;
      min-height:calc(100vh - 190px);
      border:1px solid var(--line);
      border-radius:6px;
      background:#f8fafc;
      overflow:hidden;
    }
    .pdf-viewer iframe{
      width:100%;
      height:calc(100vh - 190px);
      min-height:620px;
      border:0;
      display:block;
      background:#f8fafc;
    }
    .comments{
      margin-top:32px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }
    .comments h2{
      margin:0 0 14px;
      font-size:18px;
      line-height:1.3;
      letter-spacing:-0.01em;
    }
    @media (max-width: 760px){
      .study-shell{
        width:min(100% - 24px, 1120px);
        padding-top:10px;
      }
      .study-topbar{
        align-items:flex-start;
        flex-direction:column;
      }
      .study-hero h1{
        font-size:24px;
      }
      .study-meta{
        grid-template-columns:1fr 1fr;
      }
      .pdf-head{
        align-items:flex-start;
        flex-direction:column;
      }
      .pdf-viewer iframe{
        min-height:520px;
      }
    }
  </style>
</head>
<body>
  <div class="study-shell">
    <header class="study-topbar">
      <a class="study-brand" href="../../../index.html#study" aria-label="Study 목록으로 이동">
        <img src="../../../assets/avatar.jpg" alt="Wooseok Song" />
        <span>Study</span>
      </a>
    </header>

    <main>
      <section class="study-hero">
        <p class="study-kicker">Study Material</p>
        <h1>VGGT4D: Mining Motion Cues in Visual Geometry Transformers for 4D Scene Reconstruction</h1>
        <div class="study-meta" aria-label="Study metadata">
          <div class="study-meta-item"><span>Date</span><strong>2026.07.10</strong></div>
          <div class="study-meta-item"><span>Format</span><strong>PDF · 19 slides</strong></div>
          <div class="study-meta-item"><span>Usage</span><strong>RAISE LAB Study</strong></div>
          <div class="study-meta-item"><span>Topic</span><strong>4D Scene Reconstruction</strong></div>
        </div>
      </section>

      <section class="pdf-section" aria-labelledby="pdf-title">
        <div class="pdf-head">
          <div>
            <h2 id="pdf-title">Slides</h2>
          </div>
        </div>
        <div class="pdf-viewer">
          <iframe src="assets/VGGT4D.pdf?v=20260710#toolbar=1&navpanes=0" title="VGGT4D study slides"></iframe>
        </div>
      </section>

      <section class="comments" id="comments">
        <h2>Comments</h2>
        <script async crossorigin="anonymous"
          src="https://giscus.app/client.js"
          data-repo="noctml/noctml.github.io"
          data-repo-id="R_kgDOQthLvQ"
          data-category="General"
          data-category-id="DIC_kwDOQthLvc4C1ZaY"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="light"
          data-lang="ko">
        </script>
      </section>
    </main>
  </div>
</body>
</html>
